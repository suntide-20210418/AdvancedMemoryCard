# JVM 内存（解混淆需要足够内存）
# 1.12.2 必须使用 Java 8（当前系统默认是 Java 25）
org.gradle.java.home=D:/ProgramFiles/Zulu/zulu-8
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# 仓储 HTTP 超时。
# 实测本机到 maven.minecraftforge.net / cursemaven.com 只有 1~3 KB/s 且频繁卡住；
# Gradle 4.9 默认 30s 读超时，慢仓储会在返回 404 之前先抛 "Read timed out"，
# 而 Gradle 对传输层错误是致命失败（不像 404 会继续试下一个仓库），
# 于是解析直接中断在 cursemaven 这种与当前工件无关的仓库上。
systemProp.org.gradle.internal.http.socketTimeout=60000
systemProp.org.gradle.internal.http.connectionTimeout=30000

# ForgeGradle 3 在 apply 阶段会做一次 TLS 连通性自检（Utils.checkJavaVersion：
# 逐个连 maven.minecraftforge.net 和 libraries.minecraft.net），它用的是
# URLConnection.connect()，没有超时。链路握手阶段卡住时会无限期挂在这里，
# 表现为“配置阶段完全没输出”。这个自检只验证 JVM 根证书能不能握手，
# 关掉不影响任何实际下载；真连不上时代价是后面的下载报错，比静默挂死好。
systemProp.net.minecraftforge.gradle.test_certs=false

# ForgeGradle 3 自己那套下载器（Utils.downloadFile）用的是裸 HttpURLConnection，
# 既没 setConnectTimeout 也没 setReadTimeout，底层默认是 0 = 无限等待。
# 本机到 forge maven 会出现 TLS 握手/传输中途僵死，表现是构建停在某个任务上几分钟到永久。
# 这两个是 JVM 级别的默认值，对没有显式设置超时的 URLConnection 生效，
# 让僵死连接在 15s/60s 后抛 IOException，FG 换下一个仓库而不是一直等。
systemProp.sun.net.client.defaultConnectTimeout=15000
systemProp.sun.net.client.defaultReadTimeout=60000

# ===== 1.12.2 环境（ForgeGradle 3 / Gradle 4.9 / Java 8）=====
minecraft_version=1.12.2
forge_version=14.23.5.2860

# 1.12.2 使用 MCP snapshot 映射（1.20.1 的 Parchment 不适用于 FG3）
channel=snapshot
mcp_version=20171003-1.12

