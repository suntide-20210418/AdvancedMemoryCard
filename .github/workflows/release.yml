# 发布：构建并推送到 Modrinth / CurseForge / GitHub Release
#
# 触发：推送版本标签。标签形态沿用本仓既有约定 —— 现有标签是 1.0.0-1.12.2、1.0.1-1.21.1、
# 1.0.2-1.21.1 这类，**没有 v 前缀**，即「mod_version 原样」。glob 用 *.*.*-* 匹配该形态；
# 老 tag 里的 v1.1.x-1.20.1 也在这条 glob 的匹配范围内，但它们不会再次推送，无实际影响。
#
# 没有 workflow_dispatch：mc-publish 不提供 dry-run，手动触发无法"试发布"，
# 纯构建校验已由 build.yml 覆盖。
#
# ─── 一次性配置（仓库 Settings → Secrets and variables → Actions）─────────────
#
#   Secrets（敏感，不可见）
#     MODRINTH_TOKEN        Modrinth 个人访问令牌，权限需包含 "Create versions"
#     CURSEFORGE_TOKEN      CurseForge API Key（curseforge.com/account/api-tokens）
#
#   Variables（非敏感，日志中明文可见）
#     MODRINTH_PROJECT_ID     Modrinth 项目 ID
#     CURSEFORGE_PROJECT_ID   CurseForge 数字项目 ID
#
#   平台启用规则来自 mc-publish 的实现（src/program.ts: `if (!platformOptions?.token?.unwrap()) continue;`）：
#   只有「对应 token 非空」才会进入该平台的发布流程，否则该平台被跳过且不判失败，
#   仅在日志里给出 "No valid platform tokens found" 警告。因此这四项可以分阶段补齐：
#   项目页还在审核时先不配即可，运行摘要会明确列出被跳过的平台，GitHub Release 不受影响。
#
#   token 与 ID 必须成对配置：只给 token 不给 ID 会进入该平台的发布流程但拿不到项目，
#   结果是硬失败。两者一起加。
#
# ─── 版本一致性约束（故意做成硬校验）───────────────────────────────────────
#   标签（去掉可选的 v 前缀后）必须等于 gradle.properties 的 mod_version。
#   例：mod_version=1.0.3-1.21.1 → 打 1.0.3-1.21.1（或 v1.0.3-1.21.1，两种都接受）。
#   不一致直接报错终止 —— mod_version 会被注入 jar 内的 neoforge.mods.toml，
#   若平台上显示的版本号与 jar 内声明的对不上，玩家和下游整合包都会拿到错误信息。
#
#   上传的文件同样由 mod_id + mod_version 精确推导，不使用 build/libs/*.jar 这类通配：
#   本地 build/libs 里常残留多个历史版本的 jar（build/ 已被 .gitignore 忽略，CI 中不会
#   出现，但本地手动执行发布时会），通配会把旧版本一并上传且主文件可能选错。
name: Release

on:
  push:
    tags:
      - '*.*.*-*'

# 发布不可以被取消：中途打断可能留下半上传的版本记录。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # 创建 GitHub Release 需要

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 生成变更日志需要遍历历史标签

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # cache-read-only: false 是必需的，不是调优。
      # setup-gradle 默认「只在仓库默认分支写缓存」，而本仓默认分支是 master，
      # 日常开发却在 suntide/1.21.1 —— 不放行的话缓存永远只读、永远为空，
      # 每次运行都要重新下载整套 NeoForge 依赖与 AE2 依赖。
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      # 版本号、模组 id 与游戏版本全部从 gradle.properties 读取，
      # 使标签、平台版本号、jar 内 mod 元数据、上传文件名四者不可能各自漂移。
      - name: Resolve version metadata
        id: meta
        run: |
          set -euo pipefail

          prop() {
            sed -n "s/^[[:space:]]*$1[[:space:]]*=[[:space:]]*//p" gradle.properties \
              | head -n 1 | tr -d '\r'
          }

          mod_id="$(prop mod_id)"
          mod_version="$(prop mod_version)"
          mod_name="$(prop mod_name)"
          mc_version="$(prop minecraft_version)"

          if [ -z "$mod_id" ] || [ -z "$mod_version" ] || [ -z "$mod_name" ] || [ -z "$mc_version" ]; then
            echo "::error::无法从 gradle.properties 解析 mod_id / mod_version / mod_name / minecraft_version"
            exit 1
          fi

          # 去掉可选的 v 前缀，两种标签形态都接受，但不接受与 mod_version 不符的值
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "${tag_version}" != "${mod_version}" ]; then
            echo "::error::标签 ${GITHUB_REF_NAME} 与 gradle.properties 的 mod_version ${mod_version} 不一致"
            exit 1
          fi

          echo "标签 ${GITHUB_REF_NAME} 通过校验（mod_id=${mod_id}, minecraft=${mc_version}）"

          {
            echo "mod_id=${mod_id}"
            echo "mod_version=${mod_version}"
            echo "mod_name=${mod_name}"
            echo "mc_version=${mc_version}"
            echo "jar=build/libs/${mod_id}-${mod_version}.jar"
          } >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./gradlew build --stacktrace

      # 变更日志自己用 git 生成、三个平台共用，比交给平台自动生成更可控。
      # --match 限定在同一条 MC 线（*.*.*-<mc_version>）：本仓同时维护 1.7.10-GTNH、1.12.2、
      # 1.20.1、1.21.1 多条线，不限定的话 git describe 会跨线命中另一个 MC 版本的标签，
      # 把无关提交写进日志。
      - name: Generate changelog
        run: |
          set -euo pipefail

          tag="${GITHUB_REF_NAME}"
          mc_version="${{ steps.meta.outputs.mc_version }}"

          prev="$(git describe --tags --abbrev=0 --match "*.*.*-${mc_version}" "${tag}^" 2>/dev/null || true)"
          if [ -n "${prev}" ]; then
            echo "变更范围：${prev}..${tag}"
            range="${prev}..${tag}"
          else
            echo "未找到 ${mc_version} 线上的历史标签，输出截至该标签的完整提交记录"
            range="${tag}"
          fi

          git log --no-merges --pretty='- %s (%h)' "${range}" > CHANGELOG_LATEST.md
          echo "变更日志 $(( $(wc -l < CHANGELOG_LATEST.md) )) 行"

      # 在交给 mc-publish 之前先确认目标文件存在，否则失败信息会埋在 action 内部。
      - name: Verify jar exists
        run: |
          set -euo pipefail
          jar="${{ steps.meta.outputs.jar }}"
          if [ ! -f "$jar" ]; then
            echo "::error::期望的构建产物不存在：${jar}"
            echo "build/libs 实际内容："
            ls -la build/libs || true
            exit 1
          fi
          echo "构建产物：$(ls -l "$jar")"

      - name: Publish
        id: publish
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          # 精确到由 gradle.properties 推导出的那一个文件，不用通配。
          files: ${{ steps.meta.outputs.jar }}

          name: ${{ steps.meta.outputs.mod_name }} ${{ steps.meta.outputs.mod_version }}
          version: ${{ steps.meta.outputs.mod_version }}
          # 版本分级按 release 固定：本项目 mod_version 不使用 alpha / beta 后缀。
          # 将来若要发预览版，这行改成从标签推导即可。
          version-type: release

          # 提供 changelog-file 后，github-generate-changelog 默认为 false（不再去调 GitHub 生成）。
          changelog-file: CHANGELOG_LATEST.md

          # 显式给出这些平台元数据，不要让 action 去解析带 ${} 占位符的 neoforge.mods.toml。
          game-versions: ${{ steps.meta.outputs.mc_version }}
          loaders: neoforge
          java: 21
          # 本模组提供物品与服务端/客户端联动的 P2P 管理 GUI，两端都必须安装。
          environment: client | server

          # 与 src/main/templates/META-INF/neoforge.mods.toml 中声明的依赖一致：
          # AE2 是 required（模组本体直接引用 appeng.* 与 P2P 通道实现，缺失即无法加载）。
          # 该 toml 未声明 jade / jei，因此这里也不列 —— 平台依赖列表必须与 jar 内声明一致。
          # CurseForge 数字 ID 223794 即 build.gradle 中 curse.maven:applied-energistics-2-223794 的前半段。
          dependencies: |
            ae2(required){modrinth:XxWD5pD3}{curseforge:223794}

          # 平台凭据。token 为空 ⇒ 该平台被跳过（见文件头说明），因此审核期间也能正常跑通。
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_PROJECT_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

          retry-attempts: 3
          fail-mode: fail

      - name: Report
        if: always()
        env:
          MOD_NAME: ${{ steps.meta.outputs.mod_name }}
          MOD_VERSION: ${{ steps.meta.outputs.mod_version }}
          MODRINTH_CONFIGURED: ${{ secrets.MODRINTH_TOKEN != '' }}
          CURSEFORGE_CONFIGURED: ${{ secrets.CURSEFORGE_TOKEN != '' }}
          MODRINTH_URL: ${{ steps.publish.outputs.modrinth-url }}
          CURSEFORGE_URL: ${{ steps.publish.outputs.curseforge-url }}
        run: |
          set -uo pipefail

          if [ -n "${MODRINTH_URL}" ]; then
            modrinth="已发布：${MODRINTH_URL}"
          elif [ "${MODRINTH_CONFIGURED}" = "true" ]; then
            modrinth="已配置 token 但未取得发布结果，请检查上面的 Publish 步骤日志"
          else
            modrinth="已跳过：未配置 \`MODRINTH_TOKEN\`"
          fi

          if [ -n "${CURSEFORGE_URL}" ]; then
            curseforge="已发布：${CURSEFORGE_URL}"
          elif [ "${CURSEFORGE_CONFIGURED}" = "true" ]; then
            curseforge="已配置 token 但未取得发布结果，请检查上面的 Publish 步骤日志"
          else
            curseforge="已跳过：未配置 \`CURSEFORGE_TOKEN\`"
          fi

          {
            echo "## ${MOD_NAME} ${MOD_VERSION}"
            echo
            echo '| 平台 | 结果 |'
            echo '| --- | --- |'
            echo "| Modrinth | ${modrinth} |"
            echo "| CurseForge | ${curseforge} |"
            echo "| GitHub Release | \`${GITHUB_REF_NAME}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
