// 构建脚本仓库与 ForgeGradle 3 类路径（1.12.2 固定使用 FG3，不能用 1.20.1 的 FG6）
//
// 版本必须钉死，不能写 3.+：动态版本会让 Gradle 每次配置都去各仓库拉
// maven-metadata.xml 做版本列举。本机到 bmclapi2 的这条链路会 "Read timed out"，
// 而构建脚本类路径解析失败是致命的（不像普通依赖那样能落到下一个仓库），
// 表现是配置阶段直接 BUILD FAILED，且这次下载的东西跟后续构建毫无关系。
// 3.0.197 是 FG3 的最后一个发布版本，钉死它之后构建脚本类路径可完全离线命中缓存。
// 国内镜像默认关闭：bmclapi2 对部分工件会 302 到 bmclapi.hurtmc.com，
// 该域名在 GitHub runner 上 DNS 失败，而 FG3 遇到传输层错误不会回退下一个仓库。
// 国内本地构建加 -DcnMirror=true 启用。
buildscript {
    repositories {
        // buildscript 块在独立脚本上下文里求值，看不到外面的局部变量，所以这里直接读系统属性
        if (System.getProperty('cnMirror') == 'true') {
            maven { url = 'https://maven.aliyun.com/repository/public' }
            maven { url = 'https://bmclapi2.bangbang93.com/maven' }
        }
        maven { url = 'https://maven.minecraftforge.net/' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.0.197'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'idea'        // 迁移自 1.20.1 分支
apply plugin: 'maven-publish'

// 模组元数据（来自 gradle.properties，迁移自 1.20.1 分支）
group = mod_group_id
version = mod_version
archivesBaseName = mod_id

// 1.12.2 需要 Java 8（1.20.1 的 Java 17 工具链不适用于 FG3）
sourceCompatibility = targetCompatibility = compileJava.sourceCompatibility = compileJava.targetCompatibility = '1.8'

minecraft {
    // 1.12.2 使用 MCP snapshot 映射（Parchment 为 1.14+ 专属，此处不适用）
    mappings channel: channel, version: mcp_version

    // 应用访问转换器：暴露 PartP2PTunnel.setOutput 为 public（替代 1.20.1 的 Mixin）
    accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    // 1.20.1 的 runs.configureEach / mods{} / copyIdeResources 为 FG5+ 语法，FG3 不支持，
    // 故保留 1.12.2 原生的 runs 写法。
    runs {
        client {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
        }

        server {
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
        }
    }
}

// 仓库配置（迁移自 1.20.1 分支）
// 注意：Gradle 4.9 不支持 repository content { includeGroup } 过滤，已省略该写法。
repositories {
    mavenLocal()
    if (System.getProperty('cnMirror') == 'true') {
        maven { url 'https://maven.aliyun.com/repository/public' }
        maven {
            url = 'https://bmclapi2.bangbang93.com/maven'
        }
    }
    maven {
        url = 'https://cursemaven.com'
    }
    maven {
        url = 'https://api.modrinth.com/maven'
    }
    maven {
        url = 'https://maven.blamejared.com'
    }
    maven {
        name = 'ParchmentMC'
        url = 'https://maven.parchmentmc.org'
    }
}

// ForgeGradle 3 把「生成式仓库」（artifactural）放在 afterEvaluate 才追加，于是永远排在
// 上面手写的仓库后面。这类仓库提供的是本地算出来的工件：net.minecraft:* 、de.oceanlabs.mcp:*
// 以及 fg.deobf 产生的 *_mapped_* 。
//
// 排在后面会坏事：cursemaven.com 对它不认识的坐标照样返回 200。实测
// .../ae2-extended-life-570458/6302098_mapped_snapshot_20171003-1.12/....jar 与
// .../6302098/ae2-extended-life-570458-6302098.jar 的 Content-Length 都是 4451298，
// 即它把未经去混淆的 SRG jar 当 mapped 工件发回来。结果 Gradle 认下这个仓库，
// 去下载一个 4.4MB、内容还不该用的包，而本地生成的机会被完全跳过。
//
// 把生成式仓库提到 mavenLocal 之后：能本地算的工件不再上网问，剩下的正常落到各镜像。
afterEvaluate {
    def isGenerated = { it.getClass().name.startsWith('com.amadornes.artifactural') }
    def all = new ArrayList(repositories)
    def generated = all.findAll(isGenerated)
    if (!generated.isEmpty()) {
        def local = all.findAll { !isGenerated(it) && it.name == 'MavenLocal' }
        def remote = all.findAll { !isGenerated(it) && it.name != 'MavenLocal' }
        repositories.clear()
        local.each { repositories.add(it) }
        generated.each { repositories.add(it) }
        remote.each { repositories.add(it) }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    implementation fg.deobf("curse.maven:ae2-extended-life-570458:6302098")
    implementation "maven.modrinth:kr1RaEqy:pgcAdhbb"
}

// 资源文件令牌替换（适配 1.12.2 的 mcmod.info；对应 1.20.1 对 mods.toml/pack.mcmeta 的 expand）
processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', minecraft_version

    from(sourceSets.main.resources.srcDirs) {
        include 'mcmod.info'
        expand(
            version: project.version,
            mcversion: minecraft_version,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description,
            mod_license: mod_license
        )
    }
    from(sourceSets.main.resources.srcDirs) {
        exclude 'mcmod.info'
    }
}

jar {
    manifest {
        attributes([
            "Specification-Title"     : mod_id,
            "Specification-Vendor"    : mod_authors,
            "Specification-Version"   : "1", // We are version 1 of ourselves
            "Implementation-Title"    : project.name,
            "Implementation-Version"  : "${version}",
            "Implementation-Vendor"   : mod_authors,
            "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

jar.finalizedBy('reobfJar')

// 统一源码编码（迁移自 1.20.1 分支）
tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}

sourceSets { main { output.resourcesDir = output.classesDir } }
